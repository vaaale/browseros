services:
  bos-run-command:
    image: bos-run-command:latest
    build:
      context: ./docker/run-command
      dockerfile: Dockerfile
    entrypoint:
      - /bin/ls
    restart:
      no

  browseros:
    image: browseros:latest
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint:
      - /bin/ls
    restart:
      no

  bastion:
    image: bos-bastion:latest
    build:
      context: ./bastion
      dockerfile: Dockerfile
    ports:
      - "${BASTION_PORT:-80}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - bastion-data:/data
      - ${VOLUME_BASE:-./user-data}:/user-data
      - .:/bos-src        # BOS source repo — cloned into each new user's src/ on first login
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CONTAINER_UID=${CONTAINER_UID:-1000}
      - CONTAINER_GID=${CONTAINER_GID:-1000}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-simple}
      - BOS_IMAGE=${BOS_IMAGE:-browseros:latest}
      - BOS_REPO_PATH=/bos-src
      - MAX_CONCURRENT_INSTANCES=${MAX_CONCURRENT_INSTANCES:-50}
      - BOS_BASE_REF=${BOS_BASE_REF:-main}
      - BOS_NET=bos-net
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
    networks:
      - bos-net
    restart: unless-stopped
    # On SIGTERM the bastion stops every user container before exiting. Docker's
    # default 10 s grace is not enough for that cascade — it was SIGKILLed
    # mid-shutdown (exit 137) with containers still stopping, which orphans them.
    stop_grace_period: 120s

  omnivoice:
    image: hangrylabs/omnivoicetts:latest
    hostname: omnivoice
    profiles:
      - voice
    environment:
      - HF_HUB_OFFLINE=0
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - openai_voice_profiles:/app/openai_voice_profiles
      - ${HOME}/.cache/huggingface:/app/.cache/huggingface
    ports:
      - "7861:7861"
    networks: [ 'bos-net' ]
    # GPU support (enabled by default for this compose file)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "0" ]
              capabilities: [ gpu ]

  speaches:
    hostname: speaches
    profiles:
      - voice
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    restart: unless-stopped
    networks:
      - bos-net
    volumes:
      - speaches-huggingface:/home/ubuntu/.cache/huggingface/hub
    develop:
      watch:
        - action: rebuild
          path: ./uv.lock
        - action: sync+restart
          path: ./src
          target: /home/ubuntu/speaches/src
    env_file:
      - path: .env
        required: false
    environment:
      UVICORN_PORT: 8082
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://0.0.0.0:8082/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy: 
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "0" ]
              capabilities: [ gpu ]


# BOS user containers are spawned at runtime by the bastion.
# They are NOT defined here — the bastion creates them via the Docker API.

networks:
  bos-net:
    name: bos-net
    external: false   # created once with: docker network create bos-net

volumes:
  bastion-data:
  user-data:
  openai_voice_profiles:
  speaches-huggingface:
  falkordb-data: